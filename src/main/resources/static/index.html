<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传下载管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 8px;
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background-color: #f0f1ff;
        }

        .upload-area.drag-over {
            border-color: #764ba2;
            background-color: #e8e9ff;
        }

        .upload-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 12px;
            color: #999;
        }

        #fileInput {
            display: none;
        }

        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-right: 10px;
        }

        .btn-primary {
            background-color: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background-color: #5568d3;
            transform: translateY(-2px);
        }

        .btn-danger {
            background-color: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background-color: #ee5a52;
        }

        .btn-success {
            background-color: #51cf66;
            color: white;
        }

        .btn-success:hover {
            background-color: #40c057;
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .file-info {
            flex-grow: 1;
        }

        .file-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .file-size {
            font-size: 12px;
            color: #999;
        }

        .file-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 12px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-download {
            background-color: #51cf66;
            color: white;
        }

        .btn-download:hover {
            background-color: #40c057;
        }

        .btn-del {
            background-color: #ff6b6b;
            color: white;
        }

        .btn-del:hover {
            background-color: #ee5a52;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background-color: #e9ecef;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background-color: #667eea;
            width: 0%;
            transition: width 0.3s ease;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📁 文件管理平台</h1>

        <div id="message" class="message"></div>

        <!-- 上传区域 -->
        <div class="section">
            <div class="section-title">上传文件</div>
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">点击选择文件或拖拽文件到此处</div>
                <div class="upload-hint">支持任何类型的文件</div>
            </div>
            <input type="file" id="fileInput" multiple>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <!-- 文件列表 -->
        <div class="section">
            <div class="section-title">文件列表</div>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <button class="button btn-primary" onclick="loadFileList()">🔄 刷新列表</button>
            </div>
            <div id="fileList" class="file-list">
                <div class="empty-state">暂无文件</div>
            </div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const message = document.getElementById('message');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');

        // 上传区域点击事件
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择事件
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFiles(e.target.files);
            }
        });

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('drag-over');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('drag-over');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('drag-over');
            if (e.dataTransfer.files.length > 0) {
                uploadFiles(e.dataTransfer.files);
            }
        });

        // 上传文件函数
        function uploadFiles(files) {
            for (let file of files) {
                uploadFile(file);
            }
        }

        function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percentComplete = (e.loaded / e.total) * 100;
                    progressFill.style.width = percentComplete + '%';
                }
            });

            xhr.addEventListener('load', () => {
                progressBar.style.display = 'none';
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        showMessage('success', `✅ ${file.name} 上传成功`);
                        loadFileList();
                    } else {
                        showMessage('error', `❌ 上传失败: ${response.message}`);
                    }
                } else {
                    showMessage('error', '❌ 上传失败');
                }
            });

            xhr.addEventListener('error', () => {
                progressBar.style.display = 'none';
                showMessage('error', '❌ 上传过程中出错');
            });

            xhr.open('POST', '/api/files/upload');
            xhr.send(formData);
        }

        // 加载文件列表
        function loadFileList() {
            fetch('/api/files/list')
                .then(response => response.json())
                .then(data => {
                    if (data.success && data.files.length > 0) {
                        fileList.innerHTML = data.files.map(file => `
                            <div class="file-item">
                                <div class="file-info">
                                    <div class="file-name">📄 ${file.name}</div>
                                    <div class="file-size">大小: ${formatFileSize(parseInt(file.size))} | 修改: ${new Date(parseInt(file.modified)).toLocaleString()}</div>
                                </div>
                                <div class="file-actions">
                                    <button class="action-btn btn-download" onclick="downloadFile('${file.name}')">下载</button>
                                    <button class="action-btn btn-del" onclick="deleteFile('${file.name}')">删除</button>
                                </div>
                            </div>
                        `).join('');
                    } else {
                        fileList.innerHTML = '<div class="empty-state">暂无文件</div>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showMessage('error', '❌ 加载文件列表失败');
                });
        }

        // 下载文件
        function downloadFile(fileName) {
            const link = document.createElement('a');
            link.href = `/api/files/download/${encodeURIComponent(fileName)}`;
            link.download = fileName;
            link.click();
            showMessage('success', `✅ 开始下载: ${fileName}`);
        }

        // 删除文件
        function deleteFile(fileName) {
            if (confirm(`确定要删除 "${fileName}" 吗?`)) {
                fetch(`/api/files/delete/${encodeURIComponent(fileName)}`, {
                    method: 'DELETE'
                })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showMessage('success', `✅ 文件已删除: ${fileName}`);
                            loadFileList();
                        } else {
                            showMessage('error', `❌ 删除失败: ${data.message}`);
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showMessage('error', '❌ 删除文件失败');
                    });
            }
        }

        // 显示消息
        function showMessage(type, text) {
            message.className = `message ${type}`;
            message.textContent = text;
            setTimeout(() => {
                message.className = 'message';
            }, 3000);
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 初始化加载文件列表
        loadFileList();
    </script>
</body>

</html>
